name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated assets are up to date
        run: npm run gen:assets -- --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci --coverage
      - name: Production bundle builds (no dev code leaks)
        run: APP_ENV=production npx expo export --platform android --output-dir dist
      - name: Assert no console/curl logging in the production bundle
        run: |
          if grep -rl "curl -X" dist/_expo/static/js; then
            echo "Dev HTTP logger leaked into the production bundle" && exit 1
          fi
